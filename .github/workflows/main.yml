name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  APP_NAME: dev-ops-playground
  CONTAINER_PORT: "3000"
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Quality gates (lint + unit tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Prettier (format check)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    needs: [quality]

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  security:
    name: Security (Snyk SAST + SCA)
    runs-on: ubuntu-latest
    needs: [quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: npm audit (High+)
        run: npm run audit

      - name: Snyk Open Source (SCA) - dependencies (High+)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: >-
            --severity-threshold=high
            --fail-on=all

      - name: Snyk Code (SAST) - source code (High+)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code
          args: >-
            test
            --severity-threshold=high

  container:
    name: Container (build + scan + push)
    runs-on: ubuntu-latest
    needs: [security, codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: meta
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY}/${APP_NAME}:${GITHUB_SHA}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: false

      - name: Snyk Container - image scan (High+)
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ steps.meta.outputs.image }}
          args: >-
            --severity-threshold=high
            --file=Dockerfile
            --exclude-app-vulns
            --exclude-base-image-vulns

      - name: Push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          provenance: false

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Install k3d
        shell: bash
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Create k3d cluster
        shell: bash
        run: |
          k3d cluster create ci-cluster \
            --wait \
            --k3s-arg "--disable=traefik@server:*"
          kubectl cluster-info

      - name: Deploy manifests
        run: kubectl apply -f k8s/

      - name: Update image and wait for rollout
        shell: bash
        env:
          IMAGE: ${{ needs.container.outputs.image }}
        run: |
          kubectl set image deployment/${APP_NAME} ${APP_NAME}=${IMAGE}
          kubectl rollout status deployment/${APP_NAME} --timeout=180s

      - name: DAST smoke test (/healthz)
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward svc/${APP_NAME} 18080:80 >/tmp/port-forward.log 2>&1 &
          PF_PID=$!
          trap "kill $PF_PID" EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18080/healthz | cat

      - name: Tear down k3d cluster
        if: always()
        shell: bash
        run: k3d cluster delete ci-cluster
